<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Task</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            Team Task Manager
        </div>

        <div class="nav-links">

            <a href="/dashboard">Dashboard</a>

            <a href="/create-project">Projects</a>

            <a href="/logout">Logout</a>

        </div>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">

        <div class="auth-container">

            <h2>Create New Task</h2>

            <form method="POST">

                <!-- TASK NAME -->

                <label>
                    Task Name
                </label>

                <input type="text"
                       name="title"
                       placeholder="Enter Task Name"
                       required>


                <!-- TASK DESCRIPTION -->

                <label>
                    Task Description
                </label>

                <textarea name="description"
                          placeholder="Enter Task Description"
                          rows="5"
                          required>
                </textarea>


                <!-- START DATE -->

                <label>
                    Start Date
                </label>

                <input type="date"
                       name="start_date"
                       required>


                <!-- END DATE -->

                <label>
                    End Date
                </label>

                <input type="date"
                       name="deadline"
                       required>


                <!-- PROJECT LIST -->

                <label>
                    Select Project
                </label>

                <select name="project_id"
                        required>

                    {% for project in projects %}

                    <option value="{{ project.id }}">

                        {{ project.name }}

                    </option>

                    {% endfor %}

                </select>


                <!-- MEMBER LIST -->

                <label>
                    Assign To Member
                </label>

                <select name="assigned_to"
                        required>

                    {% for user in users %}

                        {% if user.role == "Member" %}

                        <option value="{{ user.id }}">

                            {{ user.username }}

                        </option>

                        {% endif %}

                    {% endfor %}

                </select>


                <!-- STATUS -->

                <label>
                    Task Status
                </label>

                <select name="status">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>


                <br><br>

                <!-- SUBMIT BUTTON -->

                <button type="submit">

                    Create Task

                </button>

            </form>

        </div>

    </div>

</body>

</html>
